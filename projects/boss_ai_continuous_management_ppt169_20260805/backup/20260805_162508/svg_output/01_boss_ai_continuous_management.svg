<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowPrimary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#145849"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#064FA0"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F7F9F8"/>
  </g>

  <g id="header">
    <text x="56" y="64" font-family="Trebuchet MS, Arial, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#1F2B2B">
      <tspan x="56" dy="0">Boss AI is a continuous enterprise management system,</tspan>
      <tspan x="56" dy="46">not another task-oriented executive assistant.</tspan>
    </text>
    <rect x="56" y="136" width="88" height="3" fill="#145849"/>
    <line x1="156" y1="137.5" x2="1224" y2="137.5" stroke="#DDE7E4" stroke-width="1"/>
  </g>

  <g id="task-agent-comparison">
    <text x="56" y="176" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#5E6A68">TASK-ORIENTED ASSISTANTS</text>
    <text x="56" y="210" font-family="Trebuchet MS, Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#1F2B2B">Hermes + OpenClaw</text>

    <text x="56" y="246" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5E6A68">ASK</text>
    <line x1="100" y1="240" x2="148" y2="240" stroke="#145849" stroke-opacity="0.35" stroke-width="2" marker-end="url(#arrowPrimary)"/>
    <text x="162" y="246" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5E6A68">EXECUTE</text>
    <line x1="242" y1="240" x2="290" y2="240" stroke="#145849" stroke-opacity="0.35" stroke-width="2" marker-end="url(#arrowPrimary)"/>
    <text x="304" y="246" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5E6A68">COMPLETE</text>

    <text x="56" y="282" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#5E6A68">
      <tspan x="56" dy="0">General-purpose agents respond</tspan>
      <tspan x="56" dy="28">to instructions and complete</tspan>
      <tspan x="56" dy="28">discrete executive tasks.</tspan>
    </text>
    <line x1="56" y1="356" x2="416" y2="356" stroke="#DDE7E4" stroke-width="1"/>
  </g>

  <g id="takeaway-boss-ai">
    <text x="56" y="390" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#145849">CONTINUOUS ENTERPRISE MANAGEMENT</text>
    <text x="56" y="426" font-family="Trebuchet MS, Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#145849">
      <tspan x="56" dy="0">Boss AI continuously</tspan>
      <tspan x="56" dy="30">understands and improves</tspan>
      <tspan x="56" dy="30">the business.</tspan>
    </text>
  </g>

  <g id="supporting-arguments">
    <rect x="56" y="500" width="3" height="78" fill="#145849"/>
    <text x="76" y="514" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#1F2B2B">
      <tspan x="76" dy="0"><tspan font-weight="700" fill="#145849">Sense</tspan> enterprise change continuously</tspan>
      <tspan x="76" dy="28"><tspan font-weight="700" fill="#145849">Connect</tspan> judgment, execution and interaction</tspan>
      <tspan x="76" dy="28"><tspan font-weight="700" fill="#064FA0">Measure</tspan> decisions and business follow-through</tspan>
    </text>
  </g>

  <g id="column-rule">
    <line x1="456" y1="166" x2="456" y2="586" stroke="#DDE7E4" stroke-width="1"/>
  </g>

  <g id="chart-capability-stack">
    <text x="492" y="176" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#145849">BOSS AI / CONTINUOUS MANAGEMENT SYSTEM</text>

    <rect x="492" y="194" width="732" height="392" fill="#FFFFFF" stroke="#145849" stroke-width="2"/>
    <rect x="492" y="194" width="732" height="38" fill="#EDF3F1"/>
    <use data-icon="tabler-outline/settings-ai" x="510" y="201" width="24" height="24" fill="#145849" stroke-width="2"/>
    <text x="544" y="220" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#145849">ENTERPRISE ENGINEERING &amp; SERVICE</text>
    <text x="1188" y="220" text-anchor="end" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#5E6A68">production governance</text>

    <line x1="538" y1="514" x2="538" y2="272" stroke="#145849" stroke-width="2" marker-end="url(#arrowPrimary)"/>
    <text x="554" y="286" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#145849">SENSE CHANGE</text>
    <line x1="1180" y1="272" x2="1180" y2="514" stroke="#064FA0" stroke-width="2" marker-end="url(#arrowAccent)"/>
    <text x="1162" y="246" text-anchor="end" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#064FA0">EXECUTE · LEARN · ADAPT</text>

    <rect x="610" y="488" width="504" height="62" rx="2" fill="#EDF3F1" stroke="#B7D3CD" stroke-width="1"/>
    <use data-icon="tabler-outline/schema" x="630" y="504" width="30" height="30" fill="#145849" stroke-width="2"/>
    <text x="678" y="516" font-family="Trebuchet MS, Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1F2B2B">Ontology</text>
    <text x="678" y="538" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#5E6A68">Shared enterprise semantics and operating context</text>

    <rect x="646" y="414" width="432" height="62" rx="2" fill="#145849" fill-opacity="0.10" stroke="#145849" stroke-width="1"/>
    <use data-icon="tabler-outline/brain" x="666" y="430" width="30" height="30" fill="#145849" stroke-width="2"/>
    <text x="714" y="442" font-family="Trebuchet MS, Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1F2B2B">Wiki Brain</text>
    <text x="714" y="464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#5E6A68">Persistent enterprise cognition and knowledge</text>

    <rect x="682" y="340" width="360" height="62" rx="2" fill="#145849" fill-opacity="0.20" stroke="#145849" stroke-width="1"/>
    <use data-icon="tabler-outline/route" x="702" y="356" width="30" height="30" fill="#145849" stroke-width="2"/>
    <text x="750" y="368" font-family="Trebuchet MS, Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1F2B2B">Decision &amp; Action</text>
    <text x="750" y="390" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#5E6A68">Judgment translated into governed follow-through</text>

    <rect x="718" y="252" width="288" height="76" rx="2" fill="#064FA0"/>
    <use data-icon="tabler-outline/message-circle" x="738" y="275" width="30" height="30" fill="#FFFFFF" stroke-width="2"/>
    <text x="786" y="278" font-family="Trebuchet MS, Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">GUI / Dialogue</text>
    <text x="786" y="302" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF">CEO interface</text>
    <use data-icon="tabler-outline/user-star" x="960" y="275" width="30" height="30" fill="#FFFFFF" stroke-width="2"/>

    <line x1="862" y1="328" x2="862" y2="340" stroke="#064FA0" stroke-width="2"/>
    <line x1="862" y1="402" x2="862" y2="414" stroke="#145849" stroke-width="2"/>
    <line x1="862" y1="476" x2="862" y2="488" stroke="#145849" stroke-width="2"/>
  </g>

  <g id="evidence-footer">
    <rect x="56" y="612" width="1168" height="74" fill="#FFFFFF" stroke="#B7D3CD" stroke-width="1"/>
    <text x="76" y="637" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#145849">SOURCE EVIDENCE</text>
    <line x1="215" y1="626" x2="215" y2="672" stroke="#DDE7E4" stroke-width="1"/>
    <text x="235" y="637" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2B2B">
      <tspan x="235" dy="0"><tspan font-weight="700">Executive assistant</tspan> is explicitly distinguished from an</tspan>
      <tspan x="235" dy="22"><tspan font-weight="700" fill="#145849">enterprise management decision system.</tspan></tspan>
    </text>
    <line x1="646" y1="626" x2="646" y2="672" stroke="#DDE7E4" stroke-width="1"/>
    <text x="666" y="637" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2B2B">
      <tspan x="666" dy="0"><tspan font-weight="700">Five capabilities:</tspan> Ontology · Wiki Brain · Decision &amp; Action</tspan>
      <tspan x="666" dy="22">GUI/Dialogue · Enterprise Engineering &amp; Service</tspan>
    </text>
  </g>
</svg>
